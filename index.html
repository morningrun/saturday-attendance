<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토요일 운동모임 출석부</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { font-size: 1.4rem; text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.9rem; color: #7f8c8d; margin-bottom: 20px; }
        .date-box { background: #eef2f7; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        
        /* 기본 카드 디자인 (체크 안 됨: 흰색 배경) */
        .member-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; margin-bottom: 8px; background: #ffffff; border: 1px solid #e1e8ed; border-radius: 8px; transition: 0.2s; }
        
        /* 상태별 카드 강조 디자인 */
        .member-card.checked-10 { background-color: #e8f8f5; border-color: #2ecc71; border-left: 6px solid #2ecc71; }
        .member-card.checked-5  { background-color: #ebf5fb; border-color: #3498db; border-left: 6px solid #3498db; }
        .member-card.checked-comp { background-color: #fef5e7; border-color: #f39c12; border-left: 6px solid #f39c12; }

        .member-name { font-weight: bold; font-size: 1rem; color: #2c3e50; }
        .btn-group { display: flex; gap: 6px; }

        /* 기본 버튼 스타일 */
        button { padding: 8px 10px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: bold; background: #ffffff; color: #64748b; transition: 0.2s; }
        
        /* 선택(클릭)되었을 때 버튼 색상 꽉 채우기 */
        button.selected-10 { background: #2ecc71 !important; color: white !important; border-color: #2ecc71 !important; }
        button.selected-5  { background: #3498db !important; color: white !important; border-color: #3498db !important; }
        button.selected-comp { background: #f39c12 !important; color: white !important; border-color: #f39c12 !important; }

        button:active { transform: scale(0.95); }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏃‍♂️ 토요일 운동모임 출석부</h1>
    <div class="subtitle">참석, 지각, 대회를 선택하세요!</div>
    
    <div class="date-box" id="current-date">오늘 날짜 로딩 중...</div>
    
    <div id="member-list" class="loading">회원 명단 불러오는 중...</div>
</div>

<script>
    // ⚠️ 아래 쌍따옴표 안에 구글 앱스 스크립트 웹 앱 URL을 넣으세요!
    const API_URL = "https://script.google.com/macros/s/AKfycbx9ykO9UzZo-Acrn6-VCf2AcjjXG0hWGhrsnbdcwVPiMq_46qqVW28eI1LRr6J0W9h8CQ/exec";

    const today = new Date();
    const dateStr = today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('current-date').innerText = dateStr;

    function loadData() {
        // 캐시 방지를 위해 현재 시간을 뒤에 붙여서 항상 최신 데이터를 가져옵니다.
        fetch(API_URL + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const listDiv = document.getElementById('member-list');
                listDiv.innerHTML = '';
                
                const members = data.members || [];
                const logs = data.logs || [];

                const todayAttendance = {};
                logs.forEach(log => {
                    if (log.date && log.date.includes(`${today.getFullYear()}년`)) {
                        todayAttendance[log.name] = Number(log.score);
                    }
                });

                if(members.length === 0) {
                    listDiv.innerHTML = "Members 시트에 회원 명단을 입력해 주세요.";
                    return;
                }

                members.forEach(member => {
                    const name = member.name;
                    const existingScore = todayAttendance[name];
                    const isChecked = existingScore !== undefined;

                    const card = document.createElement('div');
                    
                    let cardClass = 'member-card';
                    if (isChecked) {
                        if (existingScore === 10) cardClass += ' checked-10';
                        else if (existingScore === 5) cardClass += ' checked-5';
                        else if (existingScore === 99) cardClass += ' checked-comp'; // 대회 코드
                    }
                    card.className = cardClass;
                    
                    let btn10Class = isChecked && existingScore === 10 ? 'selected-10' : '';
                    let btn5Class = isChecked && existingScore === 5 ? 'selected-5' : '';
                    let btnCompClass = isChecked && existingScore === 99 ? 'selected-comp' : '';

                    let badgeText = '';
                    if (isChecked) {
                        if (existingScore === 10) badgeText = '🟢 참석';
                        else if (existingScore === 5) badgeText = '🔵 지각';
                        else if (existingScore === 99) badgeText = '🟠 대회';
                    }

                    let buttonsHtml = `
                        <button class="${btn10Class}" onclick="checkIn('${name}', 10, ${isChecked})">참석(+10)</button>
                        <button class="${btn5Class}" onclick="checkIn('${name}', 5, ${isChecked})">지각(+5)</button>
                        <button class="${btnCompClass}" onclick="checkIn('${name}', 99, ${isChecked})">대회(+10)</button>
                    `;

                    card.innerHTML = `
                        <div class="member-name">${name} ${badgeText}</div>
                        <div class="btn-group">${buttonsHtml}</div>
                    `;
                    listDiv.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('member-list').innerHTML = "데이터를 불러오는 데 실패했습니다. 구글 URL을 확인해 주세요.";
            });
    }

    function checkIn(name, score, isChecked) {
        let label = '참석(+10점)';
        if (score === 5) label = '지각(+5점)';
        if (score === 99) label = '대회(+10점)';

        if (isChecked) {
            if (!confirm(`[${name}]님은 이미 기록이 있습니다.\n[${label}]로 수정하시겠습니까?`)) return;
        } else {
            if (!confirm(`[${name}]님을 [${label}]으로 기록하시겠습니까?`)) return;
        }

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: score, date: dateStr, isUpdate: isChecked })
        }).then(() => {
            alert(`[반영 완료] ${name}님의 ${label}이 적용되었습니다!`);
            // 데이터가 구글 시트에 반영될 시간을 0.5초 정도 준 뒤 화면을 새로고침합니다.
            setTimeout(loadData, 500);
        }).catch(() => {
            alert("전송 중 오류가 발생했습니다.");
        });
    }

    loadData();
</script>

</body>
</html>
