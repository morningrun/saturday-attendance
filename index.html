<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토요일 운동모임 출석부</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { font-size: 1.4rem; text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.9rem; color: #7f8c8d; margin-bottom: 20px; }
        .date-box { background: #eef2f7; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; }
        .member-card { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; transition: 0.2s; }
        .member-card.checked { background-color: #f1f8f5; border-left: 4px solid #2ecc71; }
        .member-name { font-weight: bold; font-size: 1rem; }
        .btn-group { display: flex; gap: 4px; }
        button { padding: 6px 8px; font-size: 0.75rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; opacity: 0.8; }
        button.selected { opacity: 1.0; outline: 2px solid #333; transform: scale(1.05); }
        .btn-10 { background: #2ecc71; color: white; }
        .btn-5 { background: #3498db; color: white; }
        .btn-0 { background: #95a5a6; color: white; }
        .btn-minus5 { background: #e67e22; color: white; }
        .btn-minus10 { background: #e74c3c; color: white; }
        button:active { transform: scale(0.95); }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏃‍♂️ 토요일 운동모임 출석부</h1>
    <div class="subtitle">이름을 선택하고 출석 상태를 클릭하세요!</div>
    
    <div class="date-box" id="current-date">오늘 날짜 로딩 중...</div>
    
    <div id="member-list" class="loading">회원 명단 불러오는 중...</div>
</div>

<script>
    // ⚠️ 아래 쌍따옴표 안에 구글 앱스 스크립트 웹 앱 URL을 넣으세요!
    const API_URL = "https://script.google.com/macros/s/AKfycbwLA-DPKZ7Bo3HJ0SF6zbs6L_8SJn844saPUEfAO8hFi6wCXd2CoQISGsI84DH578Eq4A/exec";

    const today = new Date();
    const dateStr = `${today.getFullYear()}년 ${today.getMonth() + 1}월 ${today.getDate()}일 토요일`;
    document.getElementById('current-date').innerText = dateStr;

    function loadData() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const listDiv = document.getElementById('member-list');
                listDiv.innerHTML = '';
                
                const members = data.members || [];
                const logs = data.logs || [];

                // 오늘 날짜에 이미 기록된 출석부 매핑 (이름 -> 점수)
                const todayAttendance = {};
                logs.forEach(log => {
                    if (log.date === dateStr) {
                        todayAttendance[log.name] = Number(log.score);
                    }
                });

                if(members.length === 0) {
                    listDiv.innerHTML = "Members 시트에 회원 명단을 입력해 주세요.";
                    return;
                }

                members.forEach(member => {
                    const name = member.name;
                    const existingScore = todayAttendance[name]; // 이미 체크했으면 점수 들어있음
                    const isChecked = existingScore !== undefined;

                    const card = document.createElement('div');
                    card.className = `member-card ${isChecked ? 'checked' : ''}`;
                    
                    let buttonsHtml = `
                        <button class="btn-10 ${isChecked && existingScore === 10 ? 'selected' : ''}" onclick="checkIn('${name}', 10, ${isChecked})">정시(+10)</button>
                        <button class="btn-5 ${isChecked && existingScore === 5 ? 'selected' : ''}" onclick="checkIn('${name}', 5, ${isChecked})">지각(+5)</button>
                        <button class="btn-0 ${isChecked && existingScore === 0 ? 'selected' : ''}" onclick="checkIn('${name}', 0, ${isChecked})">불참(0)</button>
                        <button class="btn-minus5 ${isChecked && existingScore === -5 ? 'selected' : ''}" onclick="checkIn('${name}', -5, ${isChecked})">당취(-5)</button>
                        <button class="btn-minus10 ${isChecked && existingScore === -10 ? 'selected' : ''}" onclick="checkIn('${name}', -10, ${isChecked})">무단(-10)</button>
                    `;

                    card.innerHTML = `
                        <div class="member-name">${name} ${isChecked ? '✅' : ''}</div>
                        <div class="btn-group">${buttonsHtml}</div>
                    `;
                    listDiv.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('member-list').innerHTML = "데이터를 불러오는 데 실패했습니다. 구글 URL을 확인해 주세요.";
            });
    }

    function checkIn(name, score, isChecked) {
        let scoreText = score > 0 ? '+' + score : score;

        if (isChecked) {
            if (!confirm(`[${name}]님은 이미 오늘 출석이 기록되어 있습니다.\n상태를 [${scoreText}점]으로 수정하시겠습니까?`)) return;
        } else {
            if (!confirm(`[${name}]님의 출석 상태를 [${scoreText}점]으로 기록하시겠습니까?`)) return;
        }

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: score, date: dateStr, isUpdate: isChecked })
        }).then(() => {
            if (isChecked) {
                alert(`[수정 완료] ${name}님의 출석 상태가 ${scoreText}점으로 수정되었습니다!`);
            } else {
                alert(`[등록 완료] ${name}님의 출석이 정상 반영되었습니다!`);
            }
            loadData(); // 화면 새로고침
        }).catch(() => {
            alert("전송 중 오류가 발생했습니다.");
        });
    }

    loadData();
</script>

</body>
</html>
