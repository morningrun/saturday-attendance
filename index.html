<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토요일 운동모임 출석부</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h1 { font-size: 1.2rem; text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #7f8c8d; margin-bottom: 15px; }
        
        /* 탭 버튼 스타일 */
        .tab-group { display: flex; gap: 6px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
        .tab-btn { flex: 1; padding: 10px; font-size: 0.9rem; border: none; background: #f1f5f9; color: #64748b; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .tab-btn.active { background: #2c3e50; color: white; }

        .date-box { background: #eef2f7; padding: 8px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; }
        
        /* 모바일 최적화 카드 디자인 */
        .member-card { display: flex; flex-direction: column; padding: 12px; margin-bottom: 10px; background: #ffffff; border: 1px solid #e1e8ed; border-radius: 10px; transition: all 0.2s; gap: 8px; }
        
        /* 상태별 카드 강조 배경색 */
        .member-card.checked-10 { background-color: #e8f8f5 !important; border-color: #2ecc71 !important; border-left: 5px solid #2ecc71 !important; }
        .member-card.checked-5  { background-color: #ebf5fb !important; border-color: #3498db !important; border-left: 5px solid #3498db !important; }
        .member-card.checked-comp { background-color: #fef5e7 !important; border-color: #f39c12 !important; border-left: 5px solid #f39c12 !important; }

        /* 이름 영역 */
        .member-info { display: flex; justify-content: space-between; align-items: center; }
        .member-name { font-weight: bold; font-size: 1.05rem; color: #2c3e50; white-space: nowrap; }
        .badge { font-size: 0.85rem; font-weight: bold; padding: 2px 8px; border-radius: 4px; }
        
        /* 출석 버튼 그룹 */
        .btn-group { display: flex; gap: 4px; width: 100%; }
        .btn-group button { flex: 1; padding: 10px 2px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: bold; background: #ffffff; color: #64748b; text-align: center; transition: all 0.2s; }
        
        button.selected-10 { background: #2ecc71 !important; color: white !important; border-color: #2ecc71 !important; }
        button.selected-5  { background: #3498db !important; color: white !important; border-color: #3498db !important; }
        button.selected-comp { background: #f39c12 !important; color: white !important; border-color: #f39c12 !important; }
        button.btn-cancel { background: #fff5f5; color: #e74c3c; border-color: #fab6b6; }

        /* 누적 현황 리스트 스타일 */
        .rank-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        .rank-number { font-weight: bold; color: #3b82f6; width: 35px; font-size: 0.95rem; }
        .rank-name { font-weight: bold; flex: 1; font-size: 1rem; color: #1e293b; }
        .rank-detail { font-size: 0.8rem; color: #64748b; margin-right: 10px; }
        .rank-score { font-weight: bold; font-size: 1.1rem; color: #059669; }

        .hidden { display: none; }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏃‍♂️ 토요일 운동모임 출석부</h1>
    <div class="subtitle">참석, 지각, 대회를 선택하세요</div>
    
    <!-- 탭 메뉴 -->
    <div class="tab-group">
        <button class="tab-btn active" id="tab-checkin-btn" onclick="switchTab('checkin')">📋 오늘 출석 체크</button>
        <button class="tab-btn" id="tab-stats-btn" onclick="switchTab('stats')">🏆 누적 현황 / 순위</button>
    </div>

    <!-- 탭 1: 출석 체크 화면 -->
    <div id="tab-checkin">
        <div class="date-box" id="current-date">오늘 날짜 로딩 중...</div>
        <div id="member-list" class="loading">회원 명단 불러오는 중...</div>
    </div>

    <!-- 탭 2: 누적 현황 화면 -->
    <div id="tab-stats" class="hidden">
        <div class="date-box" style="background:#e0f2fe; color:#0369a1;">📊 전체 회원 누적 점수 순위</div>
        <div id="stats-list" class="loading">누적 데이터 계산 중...</div>
    </div>
</div>

<script>
    // ⚠️ 아래 쌍따옴표 안에 구글 앱스 스크립트 웹 앱 URL을 넣으세요!
    const API_URL = "https://script.google.com/macros/s/AKfycbw5XMdlIOJIxJtzxFUuWAq396hP7pQK9rzutaOyAnBLSHbwzLIPWlKWkt-m_UfaPXwv/exec";

    const today = new Date();
    const dateStr = today.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    document.getElementById('current-date').innerText = dateStr;

    let globalMembers = [];
    let globalLogs = [];
    let globalTodayAttendance = {};

    function switchTab(tabName) {
        if (tabName === 'checkin') {
            document.getElementById('tab-checkin').classList.remove('hidden');
            document.getElementById('tab-stats').classList.add('hidden');
            document.getElementById('tab-checkin-btn').classList.add('active');
            document.getElementById('tab-stats-btn').classList.remove('active');
        } else {
            document.getElementById('tab-checkin').classList.add('hidden');
            document.getElementById('tab-stats').classList.remove('hidden');
            document.getElementById('tab-checkin-btn').classList.remove('active');
            document.getElementById('tab-stats-btn').classList.add('active');
            renderStats();
        }
    }

    function loadData() {
        fetch(API_URL + "?t=" + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                globalMembers = data.members || [];
                globalLogs = data.logs || [];

                globalTodayAttendance = {};
                globalLogs.forEach(log => {
                    if (log.date && log.date.includes(`${today.getFullYear()}년`)) {
                        globalTodayAttendance[log.name] = Number(log.score);
                    }
                });

                renderCheckinList();
            })
            .catch(err => {
                document.getElementById('member-list').innerHTML = "데이터를 불러오는 데 실패했습니다. 구글 URL을 확인해 주세요.";
            });
    }

    function renderCheckinList() {
        const listDiv = document.getElementById('member-list');
        listDiv.innerHTML = '';
        
        if(globalMembers.length === 0) {
            listDiv.innerHTML = "Members 시트에 회원 명단을 입력해 주세요.";
            return;
        }

        globalMembers.forEach(member => {
            const name = member.name;
            const existingScore = globalTodayAttendance[name];
            const isChecked = existingScore !== undefined && existingScore > 0;

            const card = document.createElement('div');
            
            let cardClass = 'member-card';
            if (isChecked) {
                if (existingScore === 10) cardClass += ' checked-10';
                else if (existingScore === 5) cardClass += ' checked-5';
                else if (existingScore === 99) cardClass += ' checked-comp';
            }
            card.className = cardClass;
            
            let btn10Class = isChecked && existingScore === 10 ? 'selected-10' : '';
            let btn5Class = isChecked && existingScore === 5 ? 'selected-5' : '';
            let btnCompClass = isChecked && existingScore === 99 ? 'selected-comp' : '';

            let badgeHtml = '';
            if (isChecked) {
                if (existingScore === 10) badgeHtml = '<span class="badge" style="background:#2ecc71; color:white;">🟢 참석</span>';
                else if (existingScore === 5) badgeHtml = '<span class="badge" style="background:#3498db; color:white;">🔵 지각</span>';
                else if (existingScore === 99) badgeHtml = '<span class="badge" style="background:#f39c12; color:white;">🟠 대회</span>';
            }

            let cancelBtnHtml = isChecked ? `<button class="btn-cancel" onclick="cancelCheckIn('${name}')">취소</button>` : '';

            let buttonsHtml = `
                <button class="${btn10Class}" onclick="checkIn('${name}', 10)">참석(+10)</button>
                <button class="${btn5Class}" onclick="checkIn('${name}', 5)">지각(+5)</button>
                <button class="${btnCompClass}" onclick="checkIn('${name}', 99)">대회(+10)</button>
                ${cancelBtnHtml}
            `;

            card.innerHTML = `
                <div class="member-info">
                    <div class="member-name">${name}</div>
                    <div>${badgeHtml}</div>
                </div>
                <div class="btn-group">${buttonsHtml}</div>
            `;
            listDiv.appendChild(card);
        });
    }

    function renderStats() {
        const statsDiv = document.getElementById('stats-list');
        statsDiv.innerHTML = '';

        const userStats = {};
        globalMembers.forEach(m => {
            userStats[m.name] = { score: 0, att: 0, tardy: 0, comp: 0 };
        });

        // 점수 합산 로직 (대회 99점은 화면 합산 시 +10점으로 정산)
        globalLogs.forEach(log => {
            const name = log.name;
            const score = Number(log.score);
            if (userStats[name]) {
                if (score === 10) {
                    userStats[name].score += 10;
                    userStats[name].att += 1;
                } else if (score === 5) {
                    userStats[name].score += 5;
                    userStats[name].tardy += 1;
                } else if (score === 99) {
                    userStats[name].score += 10;
                    userStats[name].comp += 1;
                }
            }
        });

        // 점수 높은 순으로 정렬
        const sortedList = Object.keys(userStats).map(name => ({
            name: name,
            ...userStats[name]
        })).sort((a, b) => b.score - a.score);

        sortedList.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'rank-card';
            
            let rankBadge = `${index + 1}위`;
            if (index === 0) rankBadge = '🥇 1위';
            else if (index === 1) rankBadge = '🥈 2위';
            else if (index === 2) rankBadge = '🥉 3위';

            card.innerHTML = `
                <div class="rank-number">${rankBadge}</div>
                <div class="rank-name">${item.name}</div>
                <div class="rank-detail">참석${item.att} · 지각${item.tardy} · 대회${item.comp}</div>
                <div class="rank-score">${item.score}점</div>
            `;
            statsDiv.appendChild(card);
        });
    }

    function checkIn(name, score) {
        let label = '참석(+10점)';
        if (score === 5) label = '지각(+5점)';
        if (score === 99) label = '대회(+10점)';

        const currentScore = globalTodayAttendance[name];
        const isChecked = currentScore !== undefined && currentScore > 0;

        if (isChecked) {
            if (!confirm(`[${name}]님 기록을 [${label}]로 수정하시겠습니까?`)) return;
        } else {
            if (!confirm(`[${name}]님을 [${label}]으로 기록하시겠습니까?`)) return;
        }

        globalTodayAttendance[name] = score;
        
        // logs 배열 업데이트
        globalLogs.push({ date: dateStr, name: name, score: score });

        renderCheckinList();

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: score, date: dateStr, isUpdate: isChecked })
        }).catch(() => {
            alert("전송 중 오류가 발생했습니다.");
        });
    }

    function cancelCheckIn(name) {
        if (!confirm(`[${name}]님의 오늘 출석 기록을 취소하시겠습니까?`)) return;

        globalTodayAttendance[name] = 0;
        renderCheckinList();

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: 0, date: dateStr, isUpdate: true })
        }).catch(() => {
            alert("전송 중 오류가 발생했습니다.");
        });
    }

    loadData();
</script>

</body>
</html>
