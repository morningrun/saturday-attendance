<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토달 출석부</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .main-title-box { text-align: center; margin: 10px 0 5px 0; }
        .main-title { font-size: 1.8rem; font-weight: 800; color: #1e293b; }
        .subtitle { text-align: center; font-size: 0.85rem; color: #7f8c8d; margin-bottom: 15px; }
        
        .tab-group { display: flex; gap: 6px; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; position: sticky; top: 0; background: white; z-index: 10; }
        .tab-btn { flex: 1; padding: 10px 4px; font-size: 0.95rem; border: none; background: #f1f5f9; color: #64748b; font-weight: bold; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background: #2c3e50; color: white; }

        .date-scroll-wrapper { display: flex; gap: 8px; overflow-x: auto; padding: 5px 2px 12px 2px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
        .date-scroll-wrapper::-webkit-scrollbar { height: 4px; }
        .date-scroll-wrapper::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        .date-btn { flex: 0 0 auto; padding: 8px 12px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: #475569; cursor: pointer; white-space: nowrap; }
        .date-btn.active { background: #2563eb; color: white; border-color: #2563eb; box-shadow: 0 2px 4px rgba(37,99,235,0.2); }

        .member-card { display: flex; flex-direction: column; padding: 12px; margin-bottom: 10px; background: #ffffff; border: 1px solid #e1e8ed; border-radius: 10px; transition: all 0.2s; gap: 8px; }
        .member-card.checked-10 { background-color: #e8f8f5 !important; border-color: #2ecc71 !important; border-left: 5px solid #2ecc71 !important; }
        .member-card.checked-5  { background-color: #ebf5fb !important; border-color: #3498db !important; border-left: 5px solid #3498db !important; }
        .member-card.checked-comp { background-color: #fef5e7 !important; border-color: #f39c12 !important; border-left: 5px solid #f39c12 !important; }

        .member-info { display: flex; justify-content: space-between; align-items: center; }
        .member-name { font-weight: bold; font-size: 1.05rem; color: #2c3e50; white-space: nowrap; }
        .badge { font-size: 0.85rem; font-weight: bold; padding: 2px 8px; border-radius: 4px; }
        
        .btn-group { display: flex; gap: 4px; width: 100%; }
        .btn-group button { flex: 1; padding: 10px 2px; font-size: 0.85rem; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; font-weight: bold; background: #ffffff; color: #64748b; text-align: center; transition: all 0.2s; }
        
        button.selected-10 { background: #2ecc71 !important; color: white !important; border-color: #2ecc71 !important; }
        button.selected-5  { background: #3498db !important; color: white !important; border-color: #3498db !important; }
        button.selected-comp { background: #f39c12 !important; color: white !important; border-color: #f39c12 !important; }
        button.btn-cancel { background: #fff5f5; color: #e74c3c; border-color: #fab6b6; }

        .month-filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .month-btn { padding: 6px 12px; font-size: 0.8rem; border: 1px solid #cbd5e1; border-radius: 6px; background: white; cursor: pointer; font-weight: bold; color: #64748b; white-space: nowrap; }
        .month-btn.active { background: #0284c7; color: white; border-color: #0284c7; }

        .rank-card { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; margin-bottom: 8px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        .rank-number { font-weight: bold; color: #3b82f6; width: 45px; font-size: 0.95rem; }
        .rank-name { font-weight: bold; flex: 1; font-size: 1rem; color: #1e293b; }
        .rank-detail { font-size: 0.78rem; color: #64748b; margin-right: 8px; }
        .rank-score { font-weight: bold; font-size: 1.1rem; color: #059669; }

        .hidden { display: none; }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title-box">
        <div class="main-title">🏃‍♂️ 토달 출석부 👟</div>
    </div>
    <div class="subtitle">매주 토요일 운동모임 출석 & 누적 현황</div>
    
    <div class="tab-group">
        <button class="tab-btn active" id="tab-checkin-btn" onclick="switchTab('checkin')">📅 주차별 출석체크</button>
        <button class="tab-btn" id="tab-stats-btn" onclick="switchTab('stats')">🏆 <span id="current-year-text">2026</span>년 누적현황</button>
    </div>

    <div id="tab-checkin">
        <div class="date-scroll-wrapper" id="saturday-buttons"></div>
        <div id="member-list" class="loading">회원 명단 불러오는 중...</div>
    </div>

    <div id="tab-stats" class="hidden">
        <div class="month-filter" id="month-buttons"></div>
        <div id="stats-list" class="loading">누적 데이터 계산 중...</div>
    </div>
</div>

<script>
    // ⚠️ 여기에 구글 앱스 스크립트 웹 앱 URL을 넣으세요!
    const API_URL = "https://script.google.com/macros/s/AKfycbz0t7S6M_Bz1BVQPa3q-gIPkRJ1H9KdtvNkbyFSQxENxYNFb1BQvRjAjzJSBqCX807Edg/exec";

    let globalMembers = [];
    let globalLogs = [];
    let selectedDateStr = "";
    let selectedMonth = "전체";

    const currentYear = new Date().getFullYear();
    document.getElementById('current-year-text').innerText = currentYear;

    function formatDateToString(dateObj) {
        const years = dateObj.getFullYear();
        const months = dateObj.getMonth() + 1;
        const days = dateObj.getDate();
        const weekDays = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
        const weekDay = weekDays[dateObj.getDay()];
        return `${years}년 ${months}월 ${days}일 ${weekDay}`;
    }

    function initSaturdayButtons() {
        const wrapper = document.getElementById('saturday-buttons');
        wrapper.innerHTML = '';
        
        const saturdays = [];
        let curr = new Date();
        const day = curr.getDay();
        const diff = day >= 6 ? 0 : -(day + 1);
        curr.setDate(curr.getDate() + diff);
        
        for(let i = 11; i >= 0; i--) {
            let d = new Date(curr);
            d.setDate(curr.getDate() - (i * 7));
            saturdays.push(formatDateToString(d));
        }

        selectedDateStr = saturdays[saturdays.length - 1];

        saturdays.forEach((dStr, idx) => {
            const btn = document.createElement('button');
            const isLatest = (idx === saturdays.length - 1);
            btn.className = `date-btn ${isLatest ? 'active' : ''}`;
            const shortName = dStr.replace(/^\d{4}년\s*/, '');
            btn.innerText = shortName;
            
            btn.onclick = () => {
                document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedDateStr = dStr;
                renderCheckinList();
            };
            wrapper.appendChild(btn);
        });

        setTimeout(() => {
            wrapper.scrollLeft = wrapper.scrollWidth;
        }, 100);
    }

    function initMonthButtons() {
        const wrapper = document.getElementById('month-buttons');
        wrapper.innerHTML = '';
        
        const months = ["전체", "1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
        months.forEach(m => {
            const btn = document.createElement('button');
            btn.className = `month-btn ${m === selectedMonth ? 'active' : ''}`;
            btn.innerText = m;
            btn.onclick = () => {
                document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMonth = m;
                renderStats();
            };
            wrapper.appendChild(btn);
        });
    }

    function switchTab(tabName) {
        if (tabName === 'checkin') {
            document.getElementById('tab-checkin').classList.remove('hidden');
            document.getElementById('tab-stats').classList.add('hidden');
            document.getElementById('tab-checkin-btn').classList.add('active');
            document.getElementById('tab-stats-btn').classList.remove('active');
        } else {
            document.getElementById('tab-checkin').classList.add('hidden');
            document.getElementById('tab-stats').classList.remove('hidden');
            document.getElementById('tab-checkin-btn').classList.remove('active');
            document.getElementById('tab-stats-btn').classList.add('active');
            renderStats();
        }
    }

    function loadData() {
        fetch(API_URL + "?t=" + new Date().getTime())
            .then(res => {
                if (!res.ok) throw new Error("네트워크 응답 실패");
                return res.json();
            })
            .then(data => {
                globalMembers = data.members || [];
                globalLogs = data.logs || [];
                renderCheckinList();
            })
            .catch(err => {
                document.getElementById('member-list').innerHTML = 
                    "<div style='color:#e74c3c; font-weight:bold;'>데이터 연결 대기 중...<br><button onclick='loadData()' style='margin-top:10px; padding:6px 12px;'>새로고침 시도</button></div>";
            });
    }

    function renderCheckinList() {
        const listDiv = document.getElementById('member-list');
        listDiv.innerHTML = '';
        
        if(globalMembers.length === 0) {
            listDiv.innerHTML = "Members 시트에 회원 명단을 입력해 주세요.";
            return;
        }

        const dayAttendance = {};
        globalLogs.forEach(log => {
            if (log.date && log.date.trim() === selectedDateStr.trim()) {
                dayAttendance[log.name] = Number(log.score);
            }
        });

        globalMembers.forEach(member => {
            const name = member.name;
            const existingScore = dayAttendance[name];
            const isChecked = existingScore !== undefined && existingScore > 0;

            const card = document.createElement('div');
            
            let cardClass = 'member-card';
            if (isChecked) {
                if (existingScore === 10) cardClass += ' checked-10';
                else if (existingScore === 5) cardClass += ' checked-5';
                else if (existingScore === 99) cardClass += ' checked-comp';
            }
            card.className = cardClass;
            
            let btn10Class = isChecked && existingScore === 10 ? 'selected-10' : '';
            let btn5Class = isChecked && existingScore === 5 ? 'selected-5' : '';
            let btnCompClass = isChecked && existingScore === 99 ? 'selected-comp' : '';

            let badgeHtml = '';
            if (isChecked) {
                if (existingScore === 10) badgeHtml = '<span class="badge" style="background:#2ecc71; color:white;">🟢 출석</span>';
                else if (existingScore === 5) badgeHtml = '<span class="badge" style="background:#3498db; color:white;">🔵 지각</span>';
                else if (existingScore === 99) badgeHtml = '<span class="badge" style="background:#f39c12; color:white;">🟠 대회</span>';
            }

            let cancelBtnHtml = isChecked ? `<button class="btn-cancel" onclick="cancelCheckIn('${name}')">취소</button>` : '';

            let buttonsHtml = `
                <button class="${btn10Class}" onclick="checkIn('${name}', 10)">출석(+10)</button>
                <button class="${btn5Class}" onclick="checkIn('${name}', 5)">지각(+5)</button>
                <button class="${btnCompClass}" onclick="checkIn('${name}', 99)">대회(+10)</button>
                ${cancelBtnHtml}
            `;

            card.innerHTML = `
                <div class="member-info">
                    <div class="member-name">${name}</div>
                    <div>${badgeHtml}</div>
                </div>
                <div class="btn-group">${buttonsHtml}</div>
            `;
            listDiv.appendChild(card);
        });
    }

    function renderStats() {
        const statsDiv = document.getElementById('stats-list');
        statsDiv.innerHTML = '';

        const userStats = {};
        globalMembers.forEach(m => {
            userStats[m.name] = { score: 0, att: 0, tardy: 0, comp: 0 };
        });

        globalLogs.forEach(log => {
            const name = log.name;
            const score = Number(log.score);
            const logMonth = log.month || ""; 

            if (selectedMonth !== "전체") {
                const targetMonthNum = selectedMonth.replace("월", "").trim();
                if (logMonth !== targetMonthNum) {
                    return; 
                }
            }

            if (userStats[name]) {
                if (score === 10) {
                    userStats[name].score += 10;
                    userStats[name].att += 1;
                } else if (score === 5) {
                    userStats[name].score += 5;
                    userStats[name].tardy += 1;
                } else if (score === 99) {
                    userStats[name].score += 10;
                    userStats[name].comp += 1;
                }
            }
        });

        const sortedList = Object.keys(userStats).map(name => ({
            name: name,
            ...userStats[name]
        })).sort((a, b) => b.score - a.score);

        let currentRank = 1;
        sortedList.forEach((item, index) => {
            if (index > 0 && item.score < sortedList[index - 1].score) {
                currentRank = index + 1;
            }

            const card = document.createElement('div');
            card.className = 'rank-card';
            
            let rankBadge = `${currentRank}위`;
            if (currentRank === 1) rankBadge = '🥇 1위';
            else if (currentRank === 2) rankBadge = '🥈 2위';
            else if (currentRank === 3) rankBadge = '🥉 3위';

            card.innerHTML = `
                <div class="rank-number">${rankBadge}</div>
                <div class="rank-name">${item.name}</div>
                <div class="rank-detail">출석${item.att} · 지각${item.tardy} · 대회${item.comp}</div>
                <div class="rank-score">${item.score}점</div>
            `;
            statsDiv.appendChild(card);
        });
    }

    function checkIn(name, score) {
        let alreadyRecordedScore = 0;
        for(let i = 0; i < globalLogs.length; i++) {
            if(globalLogs[i].name === name && globalLogs[i].date.trim() === selectedDateStr.trim()) {
                alreadyRecordedScore = Number(globalLogs[i].score);
                break;
            }
        }

        if (alreadyRecordedScore > 0) {
            alert(`[${name}]님은 이미 이날 출석(또는 기록)이 완료되었습니다!\n변경하시려면 먼저 [취소]를 누른 후 다시 선택해 주세요.`);
            return;
        }

        let label = '출석(+10점)';
        if (score === 5) label = '지각(+5점)';
        if (score === 99) label = '대회(+10점)';

        if (!confirm(`[${selectedDateStr.replace(/^\d{4}년\s*/, '')}]\n[${name}]님을 [${label}]으로 기록하시겠습니까?`)) return;

        globalLogs.push({ date: selectedDateStr, month: selectedDateStr.match(/(\d{1,2})\s*월/)[1], name: name, score: score });
        renderCheckinList();

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: score, date: selectedDateStr })
        }).catch(() => {
            alert("전송 중 오류가 발생했습니다.");
        });
    }

    function cancelCheckIn(name) {
        if (!confirm(`[${selectedDateStr.replace(/^\d{4}년\s*/, '')}]\n[${name}]님의 출석 기록을 취소하시겠습니까?`)) return;

        for(let i = 0; i < globalLogs.length; i++) {
            if(globalLogs[i].name === name && globalLogs[i].date.trim() === selectedDateStr.trim()) {
                globalLogs[i].score = 0;
                break;
            }
        }

        renderCheckinList();

        fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, score: 0, date: selectedDateStr })
        }).catch(() => {
            alert("전송 중 오류가 발생했습니다.");
        });
    }

    initSaturdayButtons();
    initMonthButtons();
    loadData();
</script>

</body>
</html>
